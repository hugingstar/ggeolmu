services:
  postgres:
    image: postgres:15-alpine
    container_name: ggeolmu_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS must be set in .env}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      # 127.0.0.1로만 바인딩 - 외부 네트워크에서 기본 자격증명으로 DB에 접근하지 못하도록 차단
      - "127.0.0.1:5432:5432"
    volumes:
      - ./Data/pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: ggeolmu_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --save 60 1 --loglevel warning
