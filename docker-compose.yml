version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ggeolmu_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./Data/pgdata:/var/lib/postgresql/data
