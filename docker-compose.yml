version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ggeolmu_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./Data/pgdata:/var/lib/postgresql/data

  was:
    build:
      context: ./Parser
      dockerfile: Dockerfile.was
    container_name: ggeolmu_was
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASS=postgres
    depends_on:
      - postgres

  web:
    build:
      context: ./Parser
      dockerfile: Dockerfile.web
    container_name: ggeolmu_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - was

