<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Stock Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="glass-container main-wrapper">
    <header>
      <h1>🤖 Multi-Agent Stock Analyzer</h1>
      <p>종목을 검색하면 에이전트들이 분석을 위한 프롬프트를 자동으로 생성합니다.</p>
    </header>

    <main>
      <section class="search-section">
        <div class="input-group">
          <input type="text" id="symbol-input" placeholder="종목 코드 (예: 005930, AAPL)" autocomplete="off">
          <button id="search-btn">프롬프트 생성</button>
        </div>
      </section>

      <section class="result-section">
        <div class="status-panel">
          <h3>에이전트 검토 상태 (Audit)</h3>
          <div id="audit-status" class="badge-status badge-neutral">대기중</div>
          <p id="audit-reason" class="text-muted">-</p>
        </div>

        <div class="prompt-panel">
          <h3>생성된 분석 프롬프트 (Prompt Maker)</h3>
          <textarea id="prompt-output" readonly placeholder="결과가 여기에 표시됩니다..."></textarea>
          <button id="copy-btn" class="secondary-btn" disabled>클립보드에 복사</button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
